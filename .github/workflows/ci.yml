name: CI

on:
  push:
    branches: [ main, "auto-claude/**" ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Unit Tests (no simulation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov numpy torch pyyaml py_trees filelock

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Run structural validation (test_suite.py)
        run: python tools/test_suite.py

  integration-tests:
    name: Integration Tests (no simulation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy torch pyyaml py_trees filelock

      - name: Run integration tests (excluding slow sim tests)
        run: pytest tests/integration/ -v --tb=short -m "not slow"

  regression-check:
    name: Regression Baseline Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install numpy

      - name: Check baselines.json integrity
        run: |
          python -c "
          import json
          with open('baselines.json') as f:
              baselines = json.load(f)
          print('Baselines loaded:', list(baselines.keys()))
          # cycle_1 WR must exist
          assert baselines['cycle_1']['wr'] is not None, 'cycle_1 WR missing'
          print('Regression check passed')
          "
