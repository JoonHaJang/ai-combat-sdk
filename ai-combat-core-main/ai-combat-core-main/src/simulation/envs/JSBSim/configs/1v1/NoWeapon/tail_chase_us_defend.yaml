# task config - Tail Chase Deterministic: A0100 (= 우리) 가 leader (north, 도주 위치)
# R15 (2026-05-29): tail_chase 의 mirror = 우리 항상 도주 측. defensive 학습용.
task: hierarchical_singlecombat
disable_side_switch: true

# simulation config
sim_freq: 60
agent_interaction_steps: 12

# termination config
max_steps: 1500
altitude_limit: 304.8
acceleration_limit_x: 88.2
acceleration_limit_y: 88.2
acceleration_limit_z: 88.2

# aircraft config - A0100 (우리, leader/defender) 가 북쪽, B0100 (적, attacker) 가 남쪽
# 적이 우리 6시 (아래에서) 추격 — 우리 defensive escape 학습 시나리오
use_baseline: false
baseline_type: pursue
aircraft_configs: {
  A0100: {
    color: Blue,
    model: f16,
    init_state: {
      ic_long_gc_deg: 120.0,
      ic_lat_geod_deg: 60.0,      # 앞쪽 (북쪽, leader/도주 위치)
      ic_h_sl_ft: 15000,
      ic_psi_true_deg: 0.0,       # 북쪽 (도망가는 방향)
      ic_u_fps: 800.0,            # 적보다 느림 (catch up 압력)
    },
  },
  B0100: {
    color: Red,
    model: f16,
    init_state: {
      ic_h_sl_ft: 15000,
      ic_long_gc_deg: 120.0,
      ic_lat_geod_deg: 59.995,    # 뒤쪽 (남쪽, 추격 시작)
      ic_psi_true_deg: 0.0,       # 북쪽 향함 (우리 추격)
      ic_u_fps: 850.0,            # 약간 빠르게 (catch up 능력)
    },
  }
}
battle_field_center: [120.0, 60.0, 0.0]

# reward config
PostureReward_scale: 100.0
PostureReward_potential: true
PostureReward_orientation_version: v2
PostureReward_range_version: v3
PostureReward_target_dist: 0.5

AltitudeReward_safe_altitude: 1.5
AltitudeReward_danger_altitude: 0.5
AltitudeReward_Kv: 0.5

EventDrivenReward_scale: 1
EventDrivenReward_potential: true
