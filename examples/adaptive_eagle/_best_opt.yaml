      name: VerticalFight
      params:
        turn_intensity: 3
        vel: 4
  - type: Sequence
    name: CloseCombat
    children:
    - type: Condition
      name: IsCloseCombat
      params:
        dist_max_ft: 1013.76
    - type: Action
      name: SmartLeadPursuit
      params:
        heading_gain: 1.94
        vel_far: 4
        vel_close: 4
        vel_energy_adv: 3
        far_dist_ft: 9209.88
        closure_brake_kts: 496.65
        alt_dive_dist_ft: 2020.42
