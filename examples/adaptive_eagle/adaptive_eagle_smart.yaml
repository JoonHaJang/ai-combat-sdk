name: "adaptive_eagle"
version: "5.1-smart"
description: |
  v5.1 구조 + purpose-driven SmartXXX 노드

  변경:
    - LeadPursuit → SmartLeadPursuit (purpose-driven)
    - Accelerate (원거리) → SmartLeadPursuit (자체적으로 sprint 판단)
    - SmartGunAttack, ExtensionBreak 유지

tree:
  type: Selector
  children:

    # 1. Hard Deck 회피
    - type: Sequence
      name: HardDeckAvoidance
      children:
        - type: Condition
          name: BelowHardDeck
          params:
            threshold_ft: 1200
        - type: Action
          name: ClimbTo
          params:
            target_altitude_ft: 3000

    # 2. Gun WEZ 교전 — SmartGunAttack
    - type: Sequence
      name: GunEngagement
      children:
        - type: Condition
          name: DistanceBelow
          params:
            threshold_ft: 914
        - type: Condition
          name: DistanceAbove
          params:
            threshold_ft: 152
        - type: Condition
          name: ATABelow
          params:
            threshold_deg: 15
        - type: Action
          name: SmartGunAttack
          params:
            kp: 1.2
            kd: 0.5

    # 3. EIM + 기하학 융합 탈출
    - type: Sequence
      name: IntentAdaptiveEscape
      children:
        - type: Condition
          name: EnemyIntentIs
          params:
            intent: NEUTRAL_CIRCLE
            min_confidence: 0.30
        - type: Condition
          name: CustomOrbitDetector
          params:
            ata_min_deg: 35.0
            ata_max_deg: 85.0
            closure_abs_max_kts: 200.0
            dist_min_ft: 2000.0
        - type: Action
          name: HeadOnBreak

    # 4. 기하학 전용 공전 탈출 (EIM fallback)
    - type: Sequence
      name: CircularOrbitBreak
      children:
        - type: Condition
          name: CustomOrbitDetector
          params:
            ata_min_deg: 35.0
            ata_max_deg: 85.0
            closure_abs_max_kts: 200.0
            dist_min_ft: 2000.0
        - type: Action
          name: SmartLeadPursuit

    # 5. Close Combat — SmartLeadPursuit (purpose-driven)
    - type: Sequence
      name: CloseCombat
      children:
        - type: Condition
          name: DistanceBelow
          params:
            threshold_ft: 3000
        - type: Action
          name: SmartLeadPursuit

    # 6. Defensive Geometry → ExtensionBreak
    - type: Sequence
      name: DefensiveEscape
      children:
        - type: Condition
          name: IsDefensiveGeometry
          params:
            ao_min_deg: 90.0
            ta_max_deg: 70.0
        - type: Action
          name: ExtensionBreak

    # 7. Default — SmartLeadPursuit
    - type: Action
      name: SmartLeadPursuit
