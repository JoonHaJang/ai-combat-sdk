name: "adaptive_eagle_v9"
version: "9.0.0"
description: |
  Adaptive BT v9 — Trajectory-based EIM (B안)
  
  EIM이 노드 이름이 아닌 관측 궤적 패턴을 분류 (98.8% accuracy).
  6 trajectory classes: CLOSING/EXTENDING/ORBITING/CLIMBING/DIVING/GUN_RUN
  
  Counter mapping (BFM 물리 기반):
    CLOSING    → SmartHighYoYo  (closure 역전, 오버슈트 유도)
    EXTENDING  → SmartLowYoYo   (dive 가속, 거리 좁힘)
    ORBITING   → LeadPursuit    (포인팅 유지)
    CLIMBING   → SmartLowYoYo   (따라가며 에너지 전환)
    DIVING     → SmartHighYoYo  (상승 회피)
    GUN_RUN    → SmartBreakTurn (긴급 회피)

tree:
  type: Selector
  children:

    # 1. Hard Deck
    - type: Sequence
      name: HardDeckAvoidance
      children:
        - type: Condition
          name: BelowHardDeck
          params:
            threshold_ft: 1200
        - type: Action
          name: ClimbTo
          params:
            target_altitude_ft: 3000

    # 2. Gun WEZ — config/wez_params.yaml의 고정값 반영
    # max_angle_deg: 12, min_range_ft: 500, max_range_ft: 3000
    # (이전에 914ft/152ft 미터값을 feet으로 잘못 사용 → WEZ 97% 구간 누락 BUG 수정)
    - type: Sequence
      name: GunEngagement
      children:
        - type: Condition
          name: DistanceBelow
          params:
            threshold_ft: 3000
        - type: Condition
          name: DistanceAbove
          params:
            threshold_ft: 500
        - type: Condition
          name: ATABelow
          params:
            threshold_deg: 12
        - type: Action
          name: SmartGunAttack
          params:
            kp: 1.2
            kd: 0.5

    # ═══ 2c. Offensive pursuit — 뒤를 잡았으면 chase 유지 ═══
    # IsOffensiveGeometry: AO<45 (적이 앞), TA>100 (우리가 뒤)
    # dist<4000 + 우위 포지션 → LeadPursuit 커밋 (TL 보수 라우팅 우회)
    - type: Sequence
      name: OffensivePursuit
      children:
        - type: Condition
          name: IsOffensiveGeometry
          params:
            ao_max_deg: 45.0
            ta_min_deg: 100.0
        - type: Condition
          name: DistanceBelow
          params:
            threshold_ft: 4000
        - type: Action
          name: SmartLeadPursuit

    # ═══ 2.5 Data-driven Tactical Lookup (state-bin → best node) ═══
    # counter_table_proposal_v3 기반. 4D state bin에서 검증된 best WR 노드로 dispatch.
    # 커버되지 않는 state는 FAILURE 반환 → 아래 EIM 기반 분기로 폴백.
    - type: Action
      name: TacticalLookup
      params:
        lookup_path: "logs/knowledge/tactical_lookup.json"

    # ═══ 3. Trajectory-based Intent Counters (fallback when lookup misses) ═══

    # 3a. GUN_RUN → 긴급 회피 (적이 사격 시도)
    - type: Sequence
      name: CounterGunRun
      children:
        - type: Condition
          name: EnemyIntentIs
          params:
            intent: GUN_RUN
            min_confidence: 0.50
        - type: Action
          name: SmartBreakTurn

    # 3b. CLOSING → 오버슈트 유도 (적이 접근 중)
    - type: Sequence
      name: CounterClosing
      children:
        - type: Condition
          name: EnemyIntentIs
          params:
            intent: CLOSING
            min_confidence: 0.50
        - type: Action
          name: SmartHighYoYo

    # 3c. EXTENDING → dive 가속 (적이 이탈 중)
    - type: Sequence
      name: CounterExtending
      children:
        - type: Condition
          name: EnemyIntentIs
          params:
            intent: EXTENDING
            min_confidence: 0.50
        - type: Action
          name: SmartLowYoYo

    # 3d. CLIMBING → 따라가며 에너지 전환
    - type: Sequence
      name: CounterClimbing
      children:
        - type: Condition
          name: EnemyIntentIs
          params:
            intent: CLIMBING
            min_confidence: 0.50
        - type: Action
          name: SmartLowYoYo

    # 3e. DIVING → 상승 회피
    - type: Sequence
      name: CounterDiving
      children:
        - type: Condition
          name: EnemyIntentIs
          params:
            intent: DIVING
            min_confidence: 0.50
        - type: Action
          name: SmartHighYoYo

    # 3f. ORBITING → 포인팅 유지
    - type: Sequence
      name: CounterOrbiting
      children:
        - type: Condition
          name: EnemyIntentIs
          params:
            intent: ORBITING
            min_confidence: 0.50
        - type: Action
          name: SmartLeadPursuit

    # ═══ 4. Fallback (EIM confidence 낮을 때) ═══

    - type: Sequence
      name: LostPursuitReverse
      children:
        - type: Condition
          name: IsLostPursuit
          params:
            ata_min_deg: 140.0
            closure_max_kts: -100.0
            dist_min_ft: 2000.0
        - type: Action
          name: HeadOnBreak

    - type: Sequence
      name: StaleChaseBreak
      children:
        - type: Condition
          name: IsChaseStale
          params:
            streak_len: 30
            stale_closure_max: 0.0
        - type: Action
          name: SmartHighYoYo

    - type: Sequence
      name: CircularOrbitBreak
      children:
        - type: Condition
          name: CustomOrbitDetector
          params:
            ata_min_deg: 35.0
            ata_max_deg: 85.0
            closure_abs_max_kts: 200.0
            dist_min_ft: 2000.0
        - type: Action
          name: Accelerate

    - type: Sequence
      name: CloseCombat
      children:
        - type: Condition
          name: DistanceBelow
          params:
            threshold_ft: 3000
        - type: Action
          name: SmartLeadPursuit

    - type: Sequence
      name: DefensiveEscape
      children:
        - type: Condition
          name: IsDefensiveGeometry
          params:
            ao_min_deg: 90.0
            ta_max_deg: 70.0
        - type: Action
          name: ExtensionBreak

    # 5. Default
    - type: Action
      name: LeadPursuit
