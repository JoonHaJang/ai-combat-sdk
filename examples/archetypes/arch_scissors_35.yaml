    name: HardDeck
    children:
    - type: Condition
      name: BelowHardDeck
      params:
        threshold_ft: 1200
    - type: Action
      name: ClimbTo
      params:
        target_altitude_ft: 3000
  - type: Sequence
    name: GunChance
    children:
    - type: Condition
      name: DistanceBelow
      params:
        threshold_ft: 914
    - type: Condition
      name: ATABelow
      params:
        threshold_deg: 8.0
    - type: Action
      name: GunAttack
  - type: Sequence
    name: ScissorsEscape
    children:
    - type: Condition
      name: IsScissors
      params:
        ata_min: 50.0
        ata_max: 70.0
        closure_max_kts: 20.0
    - type: Action
      name: ScissorsAccel
      params:
        heading_gain: 0.5
  - type: Sequence
    name: ReengageFromDisengage
    children:
    - type: Condition
      name: IsDisengaging
      params:
        ata_min: 70.0
        closure_max_kts: -50.0
    - type: Action
      name: ReengageClimb
      params:
        heading_gain: 0.6
  - type: Sequence
    name: NearOffensiveAttack
    children:
    - type: Condition
      name: IsNearOffensive
      params:
        ata_max: 50.0
    - type: Action
      name: LeadPursuit
