    name: GunEngagement
    children:
    - type: Condition
      name: DistanceBelow
      params:
        threshold_ft: 914
    - type: Condition
      name: DistanceAbove
      params:
        threshold_ft: 152
    - type: Condition
      name: ATABelow
      params:
        threshold_deg: 8.0
    - type: Action
      name: GunAttack
  - type: Sequence
    name: ThreatResponse
    children:
    - type: Condition
      name: InEnemyWEZ
