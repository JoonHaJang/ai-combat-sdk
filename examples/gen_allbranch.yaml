      name: DefensiveManeuver
  - type: Sequence
    name: CloseCombat
    children:
    - type: Condition
      name: DistanceBelow
      params:
        threshold_ft: 2500
    - type: Action
      name: LeadPursuit
  - type: Sequence
    name: DefensiveEvasion
    children:
    - type: Condition
      name: IsDefensiveSituation
    - type: Action
      name: DefensiveManeuver
  - type: Parallel
    name: FarPursuitWithAltitude
    policy: SuccessOnOne
    children:
    - type: Action
      name: Pursue
    - type: Action
      name: AltitudeAdvantage
      params:
        target_advantage_ft: 500
