name: gen_gunfighter
version: gen_v1
description: GunAttack 특화 — 좁은 ATA에서 사격 기회 극대화
tree:
  type: Selector
  children:
  - type: Sequence
    name: HardDeckAvoidance
    children:
    - type: Condition
      name: BelowHardDeck
      params:
        threshold_ft: 1000
    - type: Action
      name: ClimbTo
      params:
        target_altitude_ft: 2500
  - type: Sequence
    name: GunEngagement
    children:
    - type: Condition
      name: DistanceBelow
      params:
        threshold_ft: 914
    - type: Condition
      name: DistanceAbove
      params:
        threshold_ft: 152
    - type: Condition
      name: ATABelow
      params:
        threshold_deg: 5.0
    - type: Action
      name: GunAttack
  - type: Sequence
    name: ThreatResponse
    children:
    - type: Condition
      name: InEnemyWEZ
      params:
        max_distance_ft: 800.0
        max_los_angle_deg: 15.0
    - type: Action
      name: BreakTurn
  - type: Sequence
    name: OffensivePress
    children:
    - type: Condition
      name: DistanceBelow
      params:
        threshold_ft: 3000
    - type: Condition
      name: IsOffensiveSituation
    - type: Action
      name: LeadPursuit
  - type: Sequence
    name: EmergencyDefense
    children:
    - type: Condition
      name: UnderThreat
      params:
        aa_threshold_deg: 120.0
    - type: Condition
      name: DistanceBelow
      params:
        threshold_ft: 800
    - type: Action
      name: BreakTurn
  - type: Sequence
    name: CloseCombat
    children:
    - type: Condition
      name: DistanceBelow
      params:
        threshold_ft: 2000
    - type: Action
      name: LeadPursuit
  - type: Action
    name: LeadPursuit
