name: L6_closure_manager
version: 1.0.0
description: closure rate manager
tree:
  type: Selector
  name: Root
  children:
  - type: Sequence
    name: HardDeck
    children:
    - type: Condition
      name: BelowHardDeck
      params:
        threshold_ft: 1000
    - type: Action
      name: ClimbTo
      params:
        target_altitude_ft: 3000
  - type: Sequence
    name: over
    children:
    - type: Condition
      name: ClosureRateAbove
      params:
        threshold_kts: 200
    - type: Action
      name: HighYoYo
  - type: Action
    name: LeadPursuit
