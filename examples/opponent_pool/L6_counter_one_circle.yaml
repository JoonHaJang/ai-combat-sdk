name: L6_counter_one_circle
version: 1.0.0
description: 'vs OneCircle: TwoCircle 강요'
tree:
  type: Selector
  name: Root
  children:
  - type: Sequence
    name: HardDeck
    children:
    - type: Condition
      name: BelowHardDeck
      params:
        threshold_ft: 1000
    - type: Action
      name: ClimbTo
      params:
        target_altitude_ft: 3000
  - type: Sequence
    name: two
    children:
    - type: Condition
      name: IsOneCircle
    - type: Action
      name: TwoCircleFight
  - type: Action
    name: Pursue
