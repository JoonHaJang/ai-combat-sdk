name: L6_energy_vertical
version: 1.0.0
description: 'vs LowEnergy: 수직 공격'
tree:
  type: Selector
  name: Root
  children:
  - type: Sequence
    name: HardDeck
    children:
    - type: Condition
      name: BelowHardDeck
      params:
        threshold_ft: 1000
    - type: Action
      name: ClimbTo
      params:
        target_altitude_ft: 3000
  - type: Sequence
    name: vertAttack
    children:
    - type: Condition
      name: IsAltAdvantage
    - type: Action
      name: HighYoYo
  - type: Action
    name: Pursue
