name: L6_snapshot
version: 1.0.0
description: HighAoA snapshot
tree:
  type: Selector
  name: Root
  children:
  - type: Sequence
    name: HardDeck
    children:
    - type: Condition
      name: BelowHardDeck
      params:
        threshold_ft: 1000
    - type: Action
      name: ClimbTo
      params:
        target_altitude_ft: 3000
  - type: Sequence
    name: snap
    children:
    - type: Condition
      name: ATABelow
      params:
        threshold_deg: 20
    - type: Condition
      name: DistanceBelow
      params:
        threshold_ft: 1500
    - type: Action
      name: GunAttack
  - type: Action
    name: LagPursuit
