name: L7_far_high_slow_max
version: 1.0.0
description: 'L7 gap-targeted: 원거리 유지 + 고고도 (우리에게 에너지 열위) + 초공격'
tree:
  type: Selector
  children:
  - type: Sequence
    name: HardDeck
    children:
    - type: Condition
      name: BelowHardDeck
      params:
        threshold_ft: 1000
    - type: Action
      name: ClimbTo
      params:
        target_altitude_ft: 2500
  - type: Sequence
    name: Gun
    children:
    - type: Condition
      name: DistanceBelow
      params:
        threshold_ft: 914
    - type: Condition
      name: ATABelow
      params:
        threshold_deg: 30.0
    - type: Action
      name: GunAttack
  - type: Sequence
    name: EnergyMgmt
    children:
    - type: Condition
      name: IsNeutralSituation
    - type: Action
      name: ClimbTo
      params:
        target_altitude_ft: 20000
  - type: Sequence
    name: Close
    children:
    - type: Condition
      name: DistanceBelow
      params:
        threshold_ft: 8000
    - type: Action
      name: LagPursuit
  - type: Action
    name: Pursue
