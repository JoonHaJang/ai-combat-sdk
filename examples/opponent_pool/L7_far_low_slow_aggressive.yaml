name: L7_far_low_slow_aggressive
version: 1.0.0
description: 'L7 gap-targeted: 원거리 유지 + 저고도 저속 (우리에게 에너지 우위) + 공격적'
tree:
  type: Selector
  children:
  - type: Sequence
    name: HardDeck
    children:
    - type: Condition
      name: BelowHardDeck
      params:
        threshold_ft: 1000
    - type: Action
      name: ClimbTo
      params:
        target_altitude_ft: 2500
  - type: Sequence
    name: Gun
    children:
    - type: Condition
      name: DistanceBelow
      params:
        threshold_ft: 914
    - type: Condition
      name: ATABelow
      params:
        threshold_deg: 20.0
    - type: Action
      name: GunAttack
  - type: Sequence
    name: EnergyMgmt
    children:
    - type: Condition
      name: IsNeutralSituation
    - type: Action
      name: DescendTo
      params:
        target_altitude_ft: 3000
  - type: Sequence
    name: Close
    children:
    - type: Condition
      name: DistanceBelow
      params:
        threshold_ft: 8000
    - type: Action
      name: LagPursuit
  - type: Action
    name: Pursue
