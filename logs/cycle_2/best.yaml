      name: BelowHardDeck
      params:
        threshold_ft: 1013
    - type: Action
      name: ClimbTo
      params:
        target_altitude_ft: 2831
  - type: Sequence
    name: GunEngagement
    children:
    - type: Condition
      name: IsWEZOpportunity
      params:
        ata_max_deg: 24.62
        dist_max_ft: 1998.97
        dist_min_ft: 116.04
    - type: Action
      name: SmartGunAttack
      params:
        kp: 1.5
        kd: 0.59
        vel_approach: 2
        vel_wez: 0
  - type: Sequence
    name: UnderFireResponse
    children:
    - type: Condition
      name: IsUnderFire
    - type: Action
      name: Jink
      params:
        alt_range: 2
        vel: 3
  - type: Sequence
    name: OvershootAvoid
    children:
    - type: Condition
      name: IsOvershooting
      params:
        closure_min_kts: 324.94
        dist_max_ft: 1392.18
    - type: Action
      name: SmartHighYoYo
      params:
        climb_ticks: 4
        climb_alt: 4
        climb_vel: 2
        dive_vel: 3
        turn_intensity: 3
  - type: Sequence
    name: IntentAdaptiveEscape
    children:
