      name: HeadOnBreak
      params:
        heading_gain: 0.37
        dive_alt: 1
        vel: 4
  - type: Sequence
    name: EnergyRecovery
    children:
    - type: Condition
      name: IsLowEnergy
      params:
        energy_diff_max_ft: -1851.12
    - type: Action
      name: SmartClimbingTurn
      params:
        climb_rate: 3
        turn_intensity: 2
        vel: 4
  - type: Sequence
    name: EnergyAttack
    children:
    - type: Condition
      name: IsHighEnergy
      params:
        energy_diff_min_ft: 1872.09
    - type: Action
      name: SmartHighYoYo
      params:
        climb_ticks: 4
        climb_alt: 4
        climb_vel: 2
        dive_vel: 3
        turn_intensity: 3
  - type: Sequence
    name: CloseCombat
    children:
    - type: Condition
      name: IsCloseCombat
      params:
        dist_max_ft: 5694.72
    - type: Action
      name: SmartLeadPursuit
      params:
        heading_gain: 1.03
        vel_far: 4
        vel_close: 4
        vel_energy_adv: 4
        far_dist_ft: 5306.69
        closure_brake_kts: 289.98
        alt_dive_dist_ft: 7189.1
  - type: Sequence
    name: DefensiveEscape
    children:
    - type: Condition
      name: IsDefensiveGeometry
      params:
        ao_min_deg: 127.53
        ta_max_deg: 73.84
    - type: Action
      name: Jink
      params:
        alt_range: 2
        vel: 3
  - type: Action
    name: SmartLeadPursuit
    params:
      heading_gain: 1.03
      vel_far: 4
      vel_close: 4
      vel_energy_adv: 4
      far_dist_ft: 5306.69
      closure_brake_kts: 289.98
      alt_dive_dist_ft: 7189.1
